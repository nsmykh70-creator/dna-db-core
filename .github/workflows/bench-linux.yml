name: Bench (Linux, native DBs)

# Runs the same comparison as scripts/bench_compare.py locally, but on a Linux
# runner with MySQL and PostgreSQL installed natively (apt + systemd), i.e.
# WITHOUT the Docker/WSL2 container overhead of the Windows dev machine.
# Trigger: manually, or whenever the benchmark script itself changes.
# Results (JSON, run log, PNG charts) are committed back to the repository.

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/bench_compare.py'
      - 'scripts/gen_charts.py'
      - '.github/workflows/bench-linux.yml'

permissions:
  contents: write

concurrency:
  group: bench-linux
  cancel-in-progress: true

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl https://sh.rustup.rs -sSf | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          else
            rustup default stable || true
          fi

      - name: Install MySQL + PostgreSQL (native, no containers)
        run: |
          set -eo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            mysql-server postgresql
          sudo systemctl start mysql || true
          sudo systemctl start postgresql

      - name: Configure MySQL (root password 'bench', database 'bench')
        run: |
          set -eo pipefail
          # Statements executed by whichever bootstrap method succeeds below.
          sudo tee /tmp/mysql-init.sql >/dev/null <<'SQL'
          ALTER USER 'root'@'localhost' IDENTIFIED BY 'bench';
          CREATE USER IF NOT EXISTS 'root'@'127.0.0.1' IDENTIFIED BY 'bench';
          GRANT ALL ON *.* TO 'root'@'127.0.0.1' WITH GRANT OPTION;
          CREATE USER IF NOT EXISTS 'bench'@'127.0.0.1' IDENTIFIED BY 'bench';
          GRANT ALL ON *.* TO 'bench'@'127.0.0.1' WITH GRANT OPTION;
          CREATE USER IF NOT EXISTS 'bench'@'localhost' IDENTIFIED BY 'bench';
          GRANT ALL ON *.* TO 'bench'@'localhost' WITH GRANT OPTION;
          CREATE DATABASE IF NOT EXISTS bench;
          FLUSH PRIVILEGES;
          SQL
          sudo chmod 644 /tmp/mysql-init.sql

          configured=0

          # (a) password-less socket login (auth_socket images)
          if sudo mysql -e "SELECT 1" >/dev/null 2>&1; then
            echo "socket login works, configuring root directly"
            sudo mysql < /tmp/mysql-init.sql && configured=1 || true
          fi

          # (b) Oracle-style temporary password in the error log
          if [ "$configured" = 0 ] && sudo test -f /var/log/mysql/error.log; then
            tmp_pw=$(sudo grep -o 'temporary password.*' \
              /var/log/mysql/error.log | tail -1 | sed 's/.*: //' || true)
            if [ -n "$tmp_pw" ]; then
              echo "trying temporary password from error.log"
              mysql -uroot -p"$tmp_pw" --connect-timeout=5 \
                < /tmp/mysql-init.sql && configured=1 || true
            fi
          fi

          # (c) restart once with --init-file (authoritative password reset)
          if [ "$configured" = 0 ]; then
            echo "resetting the root password via --init-file restart"
            sudo systemctl stop mysql
            sudo mkdir -p /etc/systemd/system/mysql.service.d
            printf '[Service]\nExecStart=\nExecStart=/usr/sbin/mysqld --init-file=/tmp/mysql-init.sql\n' \
              | sudo tee /etc/systemd/system/mysql.service.d/zz-init-file.conf >/dev/null
            sudo systemctl daemon-reload
            sudo systemctl start mysql
            sudo rm -f /etc/systemd/system/mysql.service.d/zz-init-file.conf
            sudo systemctl daemon-reload
          fi

          # verify: this must succeed for the benchmark to run
          for i in $(seq 1 60); do
            mysql -h127.0.0.1 -uroot -pbench -e "SELECT 1" >/dev/null 2>&1 && break
            sleep 2
          done
          mysql -h127.0.0.1 -uroot -pbench -e "SELECT VERSION(); SELECT @@innodb_flush_log_at_trx_commit;"

      - name: Configure PostgreSQL (user/database 'bench')
        run: |
          set -eo pipefail
          sudo -u postgres psql -c \
            "CREATE USER bench WITH PASSWORD 'bench';" || true
          sudo -u postgres psql -c \
            "CREATE DATABASE bench OWNER bench;" || true
          for i in $(seq 1 30); do
            pg_isready -h 127.0.0.1 -U bench && break
            sleep 2
          done
          pg_isready -h 127.0.0.1 -U bench

      - name: Install Python dependencies
        run: pip3 install --quiet pymysql psycopg2-binary matplotlib

      - name: Build DNA-DB (release, Linux)
        run: cargo build --release

      - name: Run the comparison benchmark
        run: |
          set -o pipefail
          PYTHONUTF8=1 python3 scripts/bench_compare.py \
            --json-out docs/bench_compare_results_linux.json \
            2>&1 | tee docs/bench_linux_run.log

      - name: Generate charts
        run: |
          PYTHONUTF8=1 python3 scripts/gen_charts.py \
            --json docs/bench_compare_results_linux.json \
            --out docs/charts/linux \
            --sql-json ""

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Native Linux benchmark (apt MySQL/PostgreSQL, no Docker)"
            echo '```'
            tail -n 14 docs/bench_linux_run.log 2>/dev/null || echo "no log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit results
        run: |
          set -eo pipefail
          git config user.name "dna-db-ci"
          git config user.email "actions@users.noreply.github.com"
          git add docs/bench_compare_results_linux.json docs/charts/linux
          git add -f docs/bench_linux_run.log
          if git diff --cached --quiet; then
            echo "results unchanged, nothing to commit"
            exit 0
          fi
          git commit -m "bench: native Linux results (ubuntu runner, no containers)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
