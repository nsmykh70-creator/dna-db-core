name: Bench (Linux, native DBs)

# Повторяет прогон из docs/DB_COMPARISON_RU.md, §8: MySQL и PostgreSQL
# ставятся НАТИВНО через apt (без Docker), DNA-DB собирается в release,
# затем выполняются scripts/bench_compare.py и scripts/gen_charts.py.
# Результаты (JSON + лог + графики) коммитятся обратно в репозиторий.
#
# Подключения, ожидаемые скриптом:
#   MySQL      root/bench @127.0.0.1:3306, база bench
#   PostgreSQL bench/bench @127.0.0.1:5432, база bench
#   DNA-DB     сервер запускается сам (admin/bench-pass)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'scripts/bench_compare.py'
      - 'scripts/gen_charts.py'
      - '.github/workflows/bench-linux.yml'

permissions:
  contents: write

jobs:
  bench:
    name: DNA-DB vs MySQL vs PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш cargo
        uses: Swatinem/rust-cache@v2

      - name: Установка MySQL (нативно, apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-server
          sudo systemctl start mysql
          sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'bench'; FLUSH PRIVILEGES;"
          sudo mysql -e "CREATE DATABASE IF NOT EXISTS bench;"

      - name: Установка PostgreSQL (нативно, apt)
        run: |
          sudo apt-get install -y postgresql postgresql-contrib
          sudo systemctl start postgresql
          sudo -u postgres psql -c "CREATE USER bench WITH PASSWORD 'bench';"
          sudo -u postgres psql -c "CREATE DATABASE bench OWNER bench;"

      - name: Python-драйверы и графика
        run: python3 -m pip install --quiet pymysql psycopg2-binary matplotlib

      - name: Сборка DNA-DB (release)
        run: cargo build --release

      - name: Сравнительный бенчмарк (durability по умолчанию у всех)
        run: python3 scripts/bench_compare.py --json-out docs/bench_compare_results_linux.json 2>&1 | tee docs/bench_linux_run.log

      - name: Перегенерация графиков
        run: python3 scripts/gen_charts.py --json docs/bench_compare_results_linux.json --out docs/charts/linux

      - name: Коммит результатов в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/bench_compare_results_linux.json docs/bench_linux_run.log docs/charts/linux/ || true
          git diff --cached --quiet || git commit -m "bench: обновление результатов сравнения с MySQL/PostgreSQL [skip ci]"
          git push
