name: CI

# Прогон, на который ссылаются docs/TEST_RESULTS.md и README:
# cargo test --release + clippy + проверка Python-скриптов.

on:
  push:
    branches: [main, cms-edition]
  pull_request:
    branches: [main, cms-edition]

jobs:
  test:
    name: cargo test --release + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Кэш cargo
        uses: Swatinem/rust-cache@v2

      - name: Сборка release
        run: cargo build --release

      - name: Все Rust-тесты
        run: cargo test --release

      - name: Линт (clippy, release, все таргеты)
        run: cargo clippy --release --all-targets

      - name: Синтаксис Python-скриптов
        run: python3 -m py_compile scripts/*.py

  # CMS Edition (ветка cms-edition): та же база + feature cms.
  # По правилам docs/CMS_EDITION_RU.md: cargo test с --features cms
  # плюс проверка, что обычная сборка без feature не сломана.
  cms-test:
    name: cargo test --features cms (CMS edition)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш cargo
        uses: Swatinem/rust-cache@v2

      - name: CMS-сборка (feature cms)
        run: cargo build --features cms

      - name: Все тесты с feature cms
        run: cargo test --features cms

      - name: Обычная сборка без cms не должна ломаться
        run: cargo check

      - name: Clippy на cms-коде
        run: cargo clippy --features cms --all-targets
