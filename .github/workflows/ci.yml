name: CI

# Прогон, на который ссылаются docs/TEST_RESULTS.md и README:
# cargo test --release + clippy + проверка Python-скриптов.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: cargo test --release + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Кэш cargo
        uses: Swatinem/rust-cache@v2

      - name: Сборка release
        run: cargo build --release

      - name: Все Rust-тесты
        run: cargo test --release

      - name: Линт (clippy, release, все таргеты)
        run: cargo clippy --release --all-targets

      - name: Синтаксис Python-скриптов
        run: python3 -m py_compile scripts/*.py
