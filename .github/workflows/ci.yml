name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: cargo test (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build (release)
        run: cargo build --release

      - name: Unit + integration tests
        run: cargo test --release 2>&1 | tee cargo_test_output.txt

      - name: Publish test summary
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^running [0-9]+ tests|^test result" cargo_test_output.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Python scripts syntax check
        run: python3 -m py_compile scripts/*.py

      - name: Upload raw test log
        uses: actions/upload-artifact@v4
        with:
          name: cargo-test-output
          path: cargo_test_output.txt

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: rustup default stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.lock') }}

      - name: Clippy
        run: cargo clippy --release --all-targets 2>&1 | tee clippy.log; exit ${PIPESTATUS[0]}

      - name: Clippy summary
        if: always()
        run: |
          echo "clippy warnings: $(grep -c '^warning' clippy.log || true)" >> "$GITHUB_STEP_SUMMARY"
