name: Resources (RAM & disk)

# Измеряет потребление RAM (суммарный PSS процессов СУБД в покое и под
# нагрузкой) и место на диске (прирост каталога данных после чистой
# остановки) для DNA-DB, MySQL и PostgreSQL на одном и том же
# детерминированном датасете (seed 42, как в bench_compare.py).
# У всех систем — настройки по умолчанию. Результаты коммитятся
# в docs/resources_compare_linux.json и попадают на лендинг.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/measure_resources.py'
      - '.github/workflows/resources.yml'

permissions:
  contents: write

jobs:
  resources:
    name: RAM & disk: DNA-DB vs MySQL vs PostgreSQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш cargo
        uses: Swatinem/rust-cache@v2

      - name: Установка MySQL (нативно, apt; БД создаёт скрипт)
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-server
          sudo systemctl start mysql
          # На runner-образах MySQL 8 предустановлен, но root@localhost НЕ
          # auth_socket: пробуем socket-аутентификацию, затем root/root.
          if sudo mysql -e "SELECT 1" >/dev/null 2>&1; then
            sudo mysql -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'bench'; FLUSH PRIVILEGES;"
          elif mysql -uroot -proot -e "SELECT 1" >/dev/null 2>&1; then
            mysql -uroot -proot -e "ALTER USER 'root'@'localhost' IDENTIFIED WITH mysql_native_password BY 'bench'; FLUSH PRIVILEGES;"
          else
            echo "MySQL: ни socket-аутентификация, ни root/root не сработали" >&2; exit 1
          fi

      - name: Установка PostgreSQL (нативно, apt; БД создаёт скрипт)
        run: |
          sudo apt-get install -y postgresql postgresql-contrib
          sudo systemctl start postgresql
          sudo -u postgres psql -tc "SELECT 1 FROM pg_roles WHERE rolname='bench'" | grep -q 1 || \
            sudo -u postgres psql -c "CREATE USER bench WITH PASSWORD 'bench';"

      - name: Python-драйверы
        run: python3 -m pip install --quiet pymysql psycopg2-binary

      - name: Сборка DNA-DB (release)
        run: cargo build --release

      - name: Измерение RAM и диска (100 000 строк, seed 42)
        run: |
          SITE=$(python3 -c "import site; print(site.getusersitepackages())")
          echo "user site-packages: $SITE"
          sudo PYTHONPATH="$SITE" python3 scripts/measure_resources.py \
            --rows 100000 --reads 4000 \
            --json-out docs/resources_compare_linux.json

      - name: Коммит результатов в репозиторий
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/resources_compare_linux.json || true
          git diff --cached --quiet || git commit -m "resources: замер RAM и диска DNA-DB vs MySQL vs PostgreSQL [skip ci]"
          git push
