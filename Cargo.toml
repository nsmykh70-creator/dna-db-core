[package]
name = "dna-db-core"
version = "3.0.0"
edition = "2021"
authors = ["DNA-DB Engineering Team"]
description = "High-performance LSM storage engine with 2-bit DNA packing, dual-strand disk hot-swap, DnaQL language, and crash resilience"
# Сплит-лицензия: веб-панель (src/admin.rs, src/admin.html) — Apache-2.0,
# ядро, SQL/DnaQL, сервер, тесты, скрипты и документация — AGPL-3.0-only. См. LICENSE.
license = "AGPL-3.0-only AND Apache-2.0"

[dependencies]
crc32fast = "1.4"
fastbloom = "0.8"
crossbeam-skiplist = "0.1"
bytes = "1.6"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
thiserror = "1.0"
sha2 = "0.10"
subtle = "2.5"
reed-solomon-erasure = "6.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
